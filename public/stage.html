<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Stage</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); box-sizing: border-box; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; color: #9aa3b2; font-size: clamp(14px, 2.2vw, 22px); }
  header .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock { color: #fff; font-variant-numeric: tabular-nums; font-size: clamp(22px, 4vw, 44px); font-weight: 600; }
  #now { font-size: clamp(22px, 5.2vw, 64px); line-height: 1.25; font-weight: 600; white-space: pre-line; overflow: hidden; }
  #now.blank { color: #4b5361; font-weight: 400; }
  footer { border-top: 1px solid #262c36; padding-top: 12px; }
  footer .label { color: #6b7483; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  #next { color: #9aa3b2; font-size: clamp(16px, 2.8vw, 32px); line-height: 1.3; white-space: pre-line; max-height: 6.6em; overflow: hidden; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #e5484d; color: #fff; font-size: 14px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<header><div class="title" id="title">Waiting for the first slide…</div><div id="clock"></div></header>
<div id="now" class="blank"></div>
<footer><div class="label">Next</div><div id="next"></div></footer>
<script type="module">
import { connect, countdownParts } from '/shared.js';
let cd = null;
setInterval(() => { if (cd) { const p = countdownParts(cd.c, Date.now() + cd.skew); $('now').textContent = p.done ? p.message : `${p.message}\n${p.time}`; } }, 500);
const $ = (id) => document.getElementById(id);
const tick = () => { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
tick(); setInterval(tick, 5000);
connect((s) => {
  if (!s) return;
  const live = s.live;
  const item = live && live.item;
  const slide = item && item.slides[live.index];
  const next = item && item.slides[live.index + 1];
  $('title').textContent = item ? `${item.title}${item.subtitle ? ' · ' + item.subtitle : ''}` : 'Waiting for the first slide…';
  if (s.black || s.clear) $('title').insertAdjacentHTML('beforeend', `<span class="pill">${s.black ? 'Black' : 'Cleared'}</span>`);
  cd = item && item.kind === 'countdown' ? { c: item.countdown, skew: s.now - Date.now() } : null;
  $('now').textContent = cd ? '' : (slide ? slide.text : '');
  $('now').classList.toggle('blank', !slide);
  $('next').textContent = next ? next.text : (item ? 'End of ' + (item.kind === 'bible' ? 'reading' : 'song') : '');
});
</script>
</body>
</html>
