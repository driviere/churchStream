<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ChurchStream camera</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; height: 100dvh; box-sizing: border-box; }
  #view { position: relative; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  video.mirror { transform: scaleX(-1); }
  #badge { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  #badge i { width: 10px; height: 10px; border-radius: 50%; background: #8a919c; display: inline-block; }
  #badge.ok i { background: #30a46c; }
  #badge.live i { background: #e5484d; }
  #badge.bad i { background: #f5a524; }
  #start { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; padding: 24px; }
  #start h1 { margin: 0; font-size: 26px; }
  #start p { margin: 0; color: #b5bcc7; font-size: 17px; line-height: 1.45; max-width: 30em; }
  .go { font: inherit; font-size: 20px; font-weight: 700; padding: 16px 34px; border-radius: 14px; border: 0; background: #3e63dd; color: #fff; }
  footer { display: flex; gap: 10px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: #111418; align-items: center; flex-wrap: wrap; }
  footer button { font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 12px; border: 1px solid #2c323c; background: #1b1f26; color: #fff; }
  footer button.on { background: #f5d90a; color: #000; border-color: #f5d90a; }
  footer button[hidden] { display: none; }
  #msg { flex: 1 1 100%; color: #b5bcc7; font-size: 15px; line-height: 1.35; }
  @media (min-width: 700px) { #msg { flex: 1; } }
</style>
</head>
<body>
  <div id="view">
    <video id="video" playsinline muted autoplay></video>
    <div id="badge" hidden><i></i><span id="badgeText"></span></div>
    <div id="start">
      <h1 id="title">ChurchStream camera</h1>
      <p id="intro">This phone becomes a camera for the stream. Hold it sideways, keep it plugged in, and keep this page open.</p>
      <div><button class="go" id="go">Start camera</button></div>
    </div>
  </div>
  <footer>
    <button id="flip" hidden>Switch camera</button>
    <button id="torch" hidden>Light</button>
    <button id="stop" hidden>Stop</button>
    <div id="msg"></div>
  </footer>
  <script src="/phonecam.js"></script>
</body>
</html>
