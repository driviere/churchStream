name: Windows build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install FFmpeg (for the FFmpeg command test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build ChurchStream.exe
        run: npm run build:exe

      - name: Smoke test the exe (UI, Bible, a 6-second recording through FFmpeg)
        shell: pwsh
        run: |
          $env:CHURCHSTREAM_NO_BROWSER = "1"
          $exe = Resolve-Path dist\ChurchStream\ChurchStream.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--port','8123' -PassThru -WorkingDirectory (Split-Path $exe)
          Start-Sleep -Seconds 6
          try {
            $r = Invoke-WebRequest http://localhost:8123/control -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "control panel returned $($r.StatusCode)" }
            $s = Invoke-RestMethod "http://localhost:8123/api/search?q=John%203:16"
            if (-not $s.bible) { throw "Bible lookup failed" }
            $st = Invoke-RestMethod http://localhost:8123/api/state
            if (-not $st.ffmpeg.ok) { throw "Bundled FFmpeg was not found" }
            Write-Host "FFmpeg: $($st.ffmpeg.version)"
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"record":true,"quality":"low","video":{"type":"testsrc"},"audio":{"source":"none"}}' http://localhost:8123/api/config | Out-Null
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"name":"Test Name","title":"Test Title","visible":true}' http://localhost:8123/api/lower-third | Out-Null
            # Preview each stream view (camera, slides, slides + camera) and print FFmpeg's view of it.
            foreach ($scene in @('camera', 'slides', 'pip')) {
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body ('{"streamScene":"' + $scene + '"}') http://localhost:8123/api/config | Out-Null
              Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"mode":"preview"}' http://localhost:8123/api/stream/start | Out-Null
              Start-Sleep -Seconds 8
              $st = Invoke-RestMethod http://localhost:8123/api/state
              Write-Host "Preview [$scene]: state=$($st.stream.state) fps=$($st.stream.fps) problem=$($st.stream.problem)"
              if ($st.stream.state -ne 'running') {
                (Invoke-RestMethod http://localhost:8123/api/logs) | Select-Object -Last 60 | ForEach-Object { Write-Host "  log: $_" }
                throw "Preview failed for scene $scene"
              }
            }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{}' http://localhost:8123/api/stream/stop | Out-Null
            Start-Sleep -Seconds 2
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{"mode":"live"}' http://localhost:8123/api/stream/start | Out-Null
            Start-Sleep -Seconds 8
            $st = Invoke-RestMethod http://localhost:8123/api/state
            Write-Host "Stream state: $($st.stream.state) encoder: $($st.stream.encoder) speed: $($st.stream.speed)x problem: $($st.stream.problem)"
            if ($st.stream.problem -match 'struggling') { throw "False 'struggling' warning on the CI machine" }
            if ($st.stream.state -ne 'running') { (Invoke-RestMethod http://localhost:8123/api/logs) | Select-Object -Last 60 | ForEach-Object { Write-Host "  log: $_" } }
            # Play a short video into the live stream through the media relay (no restart allowed).
            $ffx = Resolve-Path dist\ChurchStream\ffmpeg\ffmpeg.exe
            & $ffx -hide_banner -loglevel error -f lavfi -i color=red:s=640x360:r=25:d=15 -f lavfi -i sine=frequency=660:d=15 -c:v libx264 -c:a aac -shortest -y "$env:RUNNER_TEMP\clip.mp4"
            $clip = Invoke-RestMethod -Method Post -InFile "$env:RUNNER_TEMP\clip.mp4" -ContentType 'video/mp4' "http://localhost:8123/api/upload?name=clip.mp4"
            Write-Host "Uploaded clip: $($clip.id) duration=$($clip.duration)s"
            $item = @{ item = @{ key = 'ci-video'; kind = 'media'; title = 'CI video'; slides = @(@{ label = 'CI video'; text = '' }); media = @{ file = $clip.id; type = 'video'; duration = $clip.duration } }; index = 0 } | ConvertTo-Json -Depth 6
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $item http://localhost:8123/api/live | Out-Null
            Start-Sleep -Seconds 2
            $st = Invoke-RestMethod http://localhost:8123/api/state
            Write-Host "While the video plays: media=$($st.media.now.title) stream=$($st.stream.state) since=$($st.stream.since)"
            if (-not $st.media.now) { (Invoke-RestMethod http://localhost:8123/api/logs) | Select-Object -Last 40 | ForEach-Object { Write-Host "  log: $_" }; throw "The video did not start" }
            if ($st.stream.state -ne 'running') { (Invoke-RestMethod http://localhost:8123/api/logs) | Select-Object -Last 40 | ForEach-Object { Write-Host "  log: $_" }; throw "Stream stopped while the video played" }
            Start-Sleep -Seconds 6
            $st = Invoke-RestMethod http://localhost:8123/api/state
            Write-Host "Later: media=$($st.media.now.title) stream=$($st.stream.state) speed=$($st.stream.speed)x"
            # The CI machine has 2 slow CPUs and cannot always encode in real time; that is a
            # property of the runner (identical with the media relay switched off), so lags are
            # reported but not fatal. What must hold: the video plays and the stream keeps running.
            $lags = (Invoke-RestMethod http://localhost:8123/api/logs) | Where-Object { $_ -match 'Resumed reading .* after a lag of ([0-9.]+)s' -and [double]$Matches[1] -gt 3 }
            if ($lags) { Write-Host "::warning::Input lag on the CI machine (CPU too slow for real time): $(@($lags).Count) lines" }
            if ($st.stream.state -ne 'running') { throw "Stream stopped after the video" }
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body '{}' http://localhost:8123/api/stream/stop | Out-Null
            Start-Sleep -Seconds 2
            $rec = Get-ChildItem dist\ChurchStream\ChurchStream-data\recordings\*.mkv
            if (-not $rec -or $rec[0].Length -lt 50000) { throw "Recording was not created" }
            Write-Host "Recording OK: $($rec[0].Name) $($rec[0].Length) bytes"
            # The clip is solid red: count recorded frames whose centre pixel is red.
            & $ffx -hide_banner -loglevel error -i $rec[0].FullName -an -vf "scale=16:9,format=rgb24" -f rawvideo -y "$env:RUNNER_TEMP\frames.rgb"
            $b = [IO.File]::ReadAllBytes("$env:RUNNER_TEMP\frames.rgb")
            $fs = 16 * 9 * 3; $red = 0; $n = [math]::Floor($b.Length / $fs)
            for ($k = 0; $k -lt $n; $k++) { $o = $k * $fs + (4 * 16 + 8) * 3; if ($b[$o] -gt 170 -and $b[$o + 1] -lt 90 -and $b[$o + 2] -lt 90) { $red++ } }
            Write-Host "Recorded frames: $n, showing the video: $red"
            if ($red -lt 30) { throw "The video did not reach the recorded stream" }
            Write-Host "--- last log lines ---"
            (Invoke-RestMethod http://localhost:8123/api/logs) | Select-Object -Last 25 | ForEach-Object { Write-Host "  log: $_" }
          } finally {
            Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
            Get-Process ffmpeg -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force dist\ChurchStream\ChurchStream-data -ErrorAction SilentlyContinue

      - name: YouTube lookup and download (YouTube sometimes blocks cloud machines, so not fatal)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        run: |
          $env:CHURCHSTREAM_NO_BROWSER = "1"
          $env:CHURCHSTREAM_DATA = "$env:RUNNER_TEMP\yt-data"
          $exe = Resolve-Path dist\ChurchStream\ChurchStream.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--port','8125' -PassThru -WorkingDirectory (Split-Path $exe)
          Start-Sleep -Seconds 5
          try {
            $i = Invoke-RestMethod -TimeoutSec 20 "http://localhost:8125/api/youtube?url=https://youtu.be/jNQXAC9IVRw"
            Write-Host "Lookup: id=$($i.id) title=$($i.title) by $($i.author)"
            if ($i.title -eq 'YouTube video') { Write-Host "::warning::oEmbed lookup returned no title" }
            Invoke-RestMethod -TimeoutSec 20 -Method Post -ContentType 'application/json' -Body '{"url":"https://youtu.be/jNQXAC9IVRw","kind":"audio"}' http://localhost:8125/api/youtube/download | Out-Null
            $deadline = (Get-Date).AddMinutes(4)
            do { Start-Sleep -Seconds 3; $d = (Invoke-RestMethod -TimeoutSec 20 http://localhost:8125/api/state).download; Write-Host "  $($d.state): $($d.message)" } while ($d.state -eq 'working' -and (Get-Date) -lt $deadline)
            if ($d.state -ne 'done') { throw "Download did not finish: $($d.message)" }
            $c = Invoke-RestMethod -TimeoutSec 20 http://localhost:8125/api/clips
            Write-Host "Library: $($c[0].name) ($($c[0].type), $($c[0].duration)s) $($c[0].file)"
          } finally {
            Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
            Get-Process ffmpeg, yt-dlp -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ChurchStream-win-x64
          path: dist/ChurchStream-win-x64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChurchStream-win-x64.zip
          generate_release_notes: true
